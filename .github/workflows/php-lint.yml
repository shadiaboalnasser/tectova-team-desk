name: PHP Lint

# Checks that every PHP file parses (php -l) on each push and pull request.
# No Composer, no tests to run yet — this just catches syntax errors before deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (per README) and current stable.
        php: ['8.0', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, curl, mbstring, pdo_mysql
          coverage: none

      - name: Lint all PHP files
        run: |
          set -e
          found=0
          while IFS= read -r -d '' file; do
            found=1
            php -l "$file"
          done < <(find . -type d -name vendor -prune -o -type f -name '*.php' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No PHP files found to lint." >&2
            exit 1
          fi
